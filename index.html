<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Type Rush — ひらがなの短文を入力し、5問クリアまでの時間を計測するタイピングゲーム。"
    />
    <title>Type Rush</title>

    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="theme-color" content="#f0f1ed" />

    <!-- SNS に貼ったときの見え方。相対パスなので、どのサブパス配信でも解決できる。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Type Rush — 5問のタイピング" />
    <meta
      property="og:description"
      content="ひらがなの短文を5問。85%以上一致していれば合格で次の問題へ。クリアまでの時間を計測します。"
    />
    <meta property="og:image" content="./ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Type Rush — 5問のタイピング" />
    <meta
      name="twitter:description"
      content="ひらがなの短文を5問。85%以上一致していれば合格で次の問題へ。クリアまでの時間を計測します。"
    />
    <meta name="twitter:image" content="./ogp.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics: 訪問状況のみ計測し、個人情報は送信しません -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token":"40f6263ac64f42bb85503470e58a4ceb"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
